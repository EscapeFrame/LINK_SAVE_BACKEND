name: Refactor
description: 코드 개선이 필요할 때 사용하는 템플릿입니다.

body:
  - type: markdown
    attributes:
      value: |
        🔨 대상 코드
        어떤 부분의 코드를 리팩터링할 예정인지 설명해주세요.

  - type: markdown
    attributes:
      value: |
        💡 개선 이유
        왜 해당 코드를 리팩터링하려는지 이유를 적어주세요. 예: 가독성 향상, 중복 제거, 성능 개선 등

  - type: textarea
    id: reason
    attributes:
      label: 개선 이유
      placeholder: